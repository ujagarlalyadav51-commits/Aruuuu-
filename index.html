<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f7e8e8;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        #screen1 {
            background: radial-gradient(circle, #fff1f1 0%, #f3d5d8 100%);
        }

        .tagline {
            position: absolute;
            top: 15%;
            font-size: 22px;
            color: #7a5257;
            font-style: italic;
        }

        .heart-target {
            font-size: 80px;
            position: absolute;
            top: 28%;
            animation: float 2s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .bow-container {
            position: absolute;
            bottom: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .arrow {
            font-size: 55px;
            transform: rotate(-45deg);
            transition: transform 0.1s linear;
        }

        .instruction {
            position: absolute;
            bottom: 10%;
            font-size: 13px;
            letter-spacing: 3px;
            color: #a07a7e;
            font-weight: bold;
        }

        #screen2 {
            background-color: #c2185b;
            color: white;
            text-align: center;
        }

        #screen2 h1 {
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #screen2 p {
            font-size: 18px;
            font-style: italic;
        }

        #screen3 {
            background: linear-gradient(to bottom, #fde2e4, #fff1f2);
            text-align: center;
        }

        .tree-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
        }

        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 10px;
            height: 100px;
            background-color: #5a3d28;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .heart-bloom {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 110px;
            line-height: 1;
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tree-container.bloomed .heart-bloom {
            transform: translateX(-50%) scale(1);
        }

        .wishes h2 {
            font-size: 42px;
            color: #ad1457;
            font-family: 'Georgia', serif;
        }

        .wishes p {
            font-size: 16px;
            color: #6d4c41;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="screen1" class="screen">
        <div class="tagline">a little something, for you</div>
        <div class="heart-target">💖</div>
        <div class="bow-container" id="arrowContainer">
            <div class="arrow" id="arrow">🏹</div>
        </div>
        <div class="instruction">PULL & RELEASE</div>
    </div>

    <div id="screen2" class="screen hidden">
        <p style="opacity: 0.8;">make a wish...</p>
        <h1>Happy Birthday</h1>
        <p>to someone worth celebrating</p>
    </div>

    <div id="screen3" class="screen hidden">
        <div class="tree-container" id="treeContainer">
            <div class="trunk"></div>
            <div class="heart-bloom">💕</div>
        </div>
        <div class="wishes">
            <h2>Happy Birthday</h2>
            <p>and... make it count</p>
            <p style="font-size: 13px; color: #8d6e63; margin-top: 8px;">here's to a year that blooms</p>
        </div>
    </div>

    <script>
        const arrowContainer = document.getElementById('arrowContainer');
        const arrow = document.getElementById('arrow');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const treeContainer = document.getElementById('treeContainer');

        let isDragging = false;
        let startY = 0;

        arrowContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            startY = e.touches[0].pageY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let currentY = e.touches[0].pageY;
            let diff = currentY - startY;
            if (diff > 0 && diff < 80) {
                arrow.style.transform = `rotate(-45deg) translateY(${diff}px)`;
            }
        });

        window.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;

            arrow.style.transition = 'transform 0.3s ease-out';
            arrow.style.transform = 'rotate(-45deg) translateY(-600px)';

            setTimeout(() => {
                screen1.classList.add('hidden');
                screen2.classList.remove('hidden');

                setTimeout(() => {
                    screen2.classList.add('hidden');
                    screen3.classList.remove('hidden');

                    setTimeout(() => {
                        treeContainer.classList.add('bloomed');
                    }, 300);

                }, 2500);

            }, 300);
        });
    </script>
</body>
</html>
